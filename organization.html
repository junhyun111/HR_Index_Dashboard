<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INNODEP 조직 현황</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/organization.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img src="images/innodep_logo_white.svg" alt="INNODEP"></div>
      <div class="nav-title">WORKSPACE</div>
      <a class="nav-item" href="./index.html"><span class="nav-icon">▦</span>HR 인덱스</a>
      <a class="nav-item active" href="./organization.html"><span class="nav-icon">◎</span>조직 현황</a>
      <div class="nav-item"><span class="nav-icon">◇</span>보상 분석</div>
      <div class="nav-item"><span class="nav-icon">◷</span>근속 분석</div>
      <div class="source-badge"><strong>조직도 데이터</strong><br>브라우저 로컬 저장<br><span id="sideOrgStatus">조직도 불러옴</span></div>
    </aside>

    <main>
      <header class="topbar">
        <div><h1>조직 현황</h1><p class="subtitle">조직 구조를 확인하고 변경사항을 직접 관리합니다.</p></div>
        <div class="updated">조직도 · 브라우저 로컬 저장</div>
      </header>

      <section id="organizationView">
        <div class="org-toolbar card">
          <div>
            <strong>조직도 관리</strong>
            <span id="orgStatus">저장된 조직도를 불러왔습니다.</span>
          </div>
          <div class="org-actions">
            <button class="button button-light" id="orgImportBtn">가져오기</button>
            <button class="button button-light" id="orgExportBtn">내보내기</button>
            <button class="button button-light" id="orgResetBtn">초기 조직도</button>
            <button class="button button-secondary" id="orgAddBtn">+ 조직 추가</button>
            <button class="button button-primary" id="orgSaveBtn">변경사항 저장</button>
          </div>
          <input id="orgFileInput" type="file" accept=".json,application/json" hidden>
        </div>
        <div class="org-guide"><span>카드를 선택하면 조직명, 유형, 상위 조직을 수정할 수 있습니다.</span><span><i class="status-dot"></i> 이 브라우저에 저장</span></div>
        <div class="org-board card">
          <div class="org-chart" id="orgChart"></div>
        </div>
      </section>
    </main>
  </div>

  <dialog class="org-dialog" id="orgDialog">
    <form method="dialog" id="orgForm">
      <div class="dialog-head"><div><span class="dialog-kicker">ORGANIZATION</span><h2 id="orgDialogTitle">조직 수정</h2></div><button class="dialog-close" value="cancel" aria-label="닫기">×</button></div>
      <label>조직명<input id="orgName" maxlength="40" required placeholder="조직명을 입력하세요"></label>
      <label>조직 유형<select id="orgType" required>
        <option value="ceo">CEO</option><option value="executive">임원</option><option value="group">그룹</option>
        <option value="office">실</option><option value="division">부문</option><option value="center">센터</option>
        <option value="team">팀</option><option value="taskforce">T/F</option><option value="council">협의회</option>
      </select></label>
      <label>상위 조직<select id="orgParent"></select></label>
      <p class="form-error" id="orgFormError" aria-live="polite"></p>
      <div class="dialog-actions"><button class="button button-danger" type="button" id="orgDeleteBtn">삭제</button><span></span><button class="button button-light" value="cancel">취소</button><button class="button button-primary" type="submit">적용</button></div>
    </form>
  </dialog>

  <script src="./js/organization.js"></script>
</body>
</html>

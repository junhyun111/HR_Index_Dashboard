<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INNODEP 조직 현황</title>
  <script>(()=>{const k='hr-dashboard-theme',m=matchMedia('(prefers-color-scheme: dark)'),a=t=>{document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;const b=document.getElementById('themeToggle');if(b){const d=t==='dark';b.textContent=d?'☀':'☾';b.title=d?'라이트 모드로 전환':'다크 모드로 전환';b.setAttribute('aria-label',b.title)}};a(localStorage.getItem(k)||(m.matches?'dark':'light'));addEventListener('DOMContentLoaded',()=>{const b=document.createElement('button');b.id='themeToggle';b.className='theme-toggle';b.type='button';b.onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem(k,t);a(t)};const h=document.querySelector('.topbar');if(h){const r=h.lastElementChild,g=document.createElement('div');g.className='topbar-actions';r.replaceWith(g);g.append(b,r)}else{b.classList.add('theme-toggle-floating');document.body.append(b)}a(document.documentElement.dataset.theme)})})()</script>
  <link rel="stylesheet" href="./css/style.css?v=20260724-dark2">
  <link rel="stylesheet" href="./css/organization.css?v=20260727-compact-tree1">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="./index.html" aria-label="HR Index Dashboard 홈"><img src="images/innodep_logo_white.svg" alt="INNODEP"></a>
      <div class="nav-title">WORKSPACE</div>
      <a class="nav-item" href="./index.html"><span class="nav-icon">▦</span>HR 인덱스</a>
    <a class="nav-item active" href="./organization.html"><span class="nav-icon">◎</span>조직 현황</a>
    <a class="nav-item" href="./management.html"><span class="nav-icon">▤</span>경영지표</a>
    <a class="nav-item" href="./settings.html"><span class="nav-icon">⚙</span>설정</a>
      <div class="source-badge"><strong>조직도 데이터</strong><br>브라우저 로컬 저장<br><span id="sideOrgStatus">조직도 불러옴</span></div>
    </aside>

    <main>
      <header class="topbar">
        <div><h1>조직 현황</h1><p class="subtitle">조직 구조를 확인하고 변경사항을 직접 관리합니다.</p></div>
        <button class="theme-toggle theme-toggle-static" type="button" aria-label="다크모드 전환" onclick="const d=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('hr-dashboard-theme',d);document.documentElement.dataset.theme=d;document.documentElement.style.colorScheme=d"><span class="theme-sun">☀</span><span class="theme-moon">☾</span></button>
        <div class="updated">조직도 · 브라우저 로컬 저장</div>
      </header>

      <section id="organizationView">
        <div class="org-toolbar card">
          <div>
            <strong>조직도 관리</strong>
            <span id="orgStatus">저장된 조직도를 불러왔습니다.</span>
          </div>
          <div class="org-actions">
            <button class="button button-light" id="orgImportBtn">가져오기</button>
            <button class="button button-light" id="orgExportBtn">내보내기</button>
            <button class="button button-light" id="orgResetBtn">초기 조직도</button>
            <button class="button button-secondary" id="orgAddBtn">+ 조직 추가</button>
            <button class="button button-primary" id="orgSaveBtn">변경사항 저장</button>
          </div>
          <input id="orgFileInput" type="file" accept=".json,application/json" hidden>
        </div>
        <div class="org-guide"><span>카드를 선택하면 조직명과 상위 조직을 수정할 수 있습니다.</span><span><i class="status-dot"></i> 이 브라우저에 저장</span></div>
        <div class="org-board card">
          <div class="org-chart" id="orgChart"></div>
        </div>
      </section>
    </main>
  </div>

  <dialog class="org-dialog" id="orgDialog">
    <form method="dialog" id="orgForm">
      <div class="dialog-head"><div><span class="dialog-kicker">ORGANIZATION</span><h2 id="orgDialogTitle">조직 수정</h2></div><button class="dialog-close" value="cancel" aria-label="닫기">×</button></div>
      <label>조직명<input id="orgName" maxlength="40" required placeholder="조직명을 입력하세요"></label>
      <label>상위 조직<select id="orgParent"></select></label>
      <p class="form-error" id="orgFormError" aria-live="polite"></p>
      <div class="dialog-actions"><button class="button button-danger" type="button" id="orgDeleteBtn">삭제</button><span></span><button class="button button-light" value="cancel">취소</button><button class="button button-primary" type="submit">적용</button></div>
    </form>
  </dialog>

  <script src="./js/organization.js?v=20260727-compact-tree1"></script>
</body>
</html>
